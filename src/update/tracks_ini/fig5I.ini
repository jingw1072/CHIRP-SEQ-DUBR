# pyGenomeTracks config for Fig 5I: DUBR ChIRP + H3K27me3 (WT / dEX1 / dEX2)
# at direct DUBR-target genes (ATF5, TAF12, CSF1, ACVRL1).
#
# One [section] = one track, drawn top to bottom. File paths are relative to
# the analysis folder (the run script does `cd` there first). Tracks that
# should be compared to each other (the three H3K27me3 conditions) share the
# same min_value / max_value - that is what the paper's "[0 - 3]" labels mean.
# If a locus is clipped or too flat, just change max_value and re-run.

[x-axis]
where = top
fontsize = 9

[spacer]
height = 0.2

[DUBR ChIRP (ours, EVEN+ODD)]
file = bigwig/DUBR_CPM.bw
title = DUBR ChIRP (ours, EVEN+ODD)
color = black
height = 1.1
min_value = 0
max_value = 5
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[ChIRP (authors' EVEN, GEO)]
file = tracks/avg/ChIRPauthors_EVEN.bw
title = ChIRP (authors' EVEN, GEO)
color = grey
height = 1.1
min_value = 0
max_value = 1
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[spacer]
height = 0.25

[H3K27me3 WT]
file = tracks/avg/H3K27me3_WT.bw
title = H3K27me3 WT
color = #1f77b4
height = 1.1
min_value = 0
max_value = 0.8
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[H3K27me3 dEX1]
file = tracks/avg/H3K27me3_EX1.bw
title = H3K27me3 dEX1
color = #1f77b4
height = 1.1
min_value = 0
max_value = 0.8
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[H3K27me3 dEX2]
file = tracks/avg/H3K27me3_EX2.bw
title = H3K27me3 dEX2
color = #1f77b4
height = 1.1
min_value = 0
max_value = 0.8
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[spacer]
height = 0.25

[DUBR peaks]
file = peaks/DUBR_peaks_final.bed
title = DUBR peaks (final)
color = black
height = 0.4
display = collapsed
labels = false
file_type = bed

[genes]
file = tracks/refGene_hg19_genes.bed
title = refGene
color = navy
height = 1.6
style = UCSC
labels = true
fontsize = 9
file_type = bed

# pyGenomeTracks config for the DUBR-locus sanity check (not a paper panel).
#
# The ChIRP probes hybridise to DUBR RNA; nascent transcripts tether the pulled-
# down chromatin to the DUBR gene itself, so EVEN and ODD must both show a large
# peak here while Input stays flat. RNA-seq should show DUBR lost in dEX1
# (promoter / exon-1 deletion) but present in dEX2 (3' deletion) - Fig 3A.

[x-axis]
where = top
fontsize = 9

[spacer]
height = 0.2

# ---------------------------------------------------------------- ChIRP pools
[ChIRP EVEN]
file = bigwig/EVEN_CPM.bw
title = ChIRP EVEN
color = #c0392b
height = 1.1
min_value = 0
max_value = 10
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[ChIRP ODD]
file = bigwig/ODD_CPM.bw
title = ChIRP ODD
color = #2471a3
height = 1.1
min_value = 0
max_value = 10
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[ChIRP Input]
file = bigwig/Input_CPM.bw
title = ChIRP Input
color = grey
height = 1.1
min_value = 0
max_value = 10
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[spacer]
height = 0.25

# ---------------------------------------------------------------- RNA-seq
[RNA WT]
file = tracks/avg/RNA_WT.bw
title = RNA WT
color = #d62728
height = 1.1
min_value = 0
max_value = 4
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[RNA dEX1]
file = tracks/avg/RNA_EX1.bw
title = RNA dEX1
color = #d62728
height = 1.1
min_value = 0
max_value = 4
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[RNA dEX2]
file = tracks/avg/RNA_EX2.bw
title = RNA dEX2
color = #d62728
height = 1.1
min_value = 0
max_value = 4
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[spacer]
height = 0.25

[H3K4me3 WT]
file = tracks/avg/H3K4me3_WT.bw
title = H3K4me3 WT
color = #8e44ad
height = 1.1
min_value = 0
max_value = 3
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[spacer]
height = 0.25

[DUBR peaks]
file = peaks/DUBR_peaks_final.bed
title = DUBR peaks (final)
color = black
height = 0.4
display = collapsed
labels = false
file_type = bed

[genes]
file = tracks/refGene_hg19_genes.bed
title = refGene
color = navy
height = 1.6
style = UCSC
labels = true
fontsize = 9
file_type = bed

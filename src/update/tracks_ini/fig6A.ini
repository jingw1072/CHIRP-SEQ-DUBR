# pyGenomeTracks config for Fig 6A: the HES1 locus with DUBR ChIRP, RNA-seq and
# three histone marks, each in WT / dEX1 / dEX2.
#
# One [section] = one track. Paths are relative to the analysis folder.
# The three conditions of each assay share min_value / max_value so that WT
# and the two mutants are directly comparable (the paper's "[0 - 3]" labels).
# Adjust max_value if something is clipped or too flat, then re-run.

[x-axis]
where = top
fontsize = 9

[spacer]
height = 0.2

# ---------------------------------------------------------------- ChIRP-seq
[DUBR ChIRP (ours, EVEN+ODD)]
file = bigwig/DUBR_CPM.bw
title = DUBR ChIRP (ours, EVEN+ODD)
color = black
height = 1.1
min_value = 0
max_value = 10
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[ChIRP (authors' EVEN, GEO)]
file = tracks/avg/ChIRPauthors_EVEN.bw
title = ChIRP (authors' EVEN, GEO)
color = grey
height = 1.1
min_value = 0
max_value = 1
number_of_bins = 700
nans_to_zeros = true
show_data_range = true
file_type = bigwig

[spacer]
height = 0.25

